<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Food and Groceries</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>
<body>

    <header class="hero-section">
        <nav class="navbar">
            <a href="#" class="logo">
                <img src="assets/swiggyLogo.jpg" alt="Swiggy Logo">
            </a>
            <div class="nav-links">
                <a href="#">Swiggy Corporate</a>
                <a href="#">Partner with us</a>
                <a href="#" class="app-btn">Get the App ↗</a>
                <a href="#" class="signin-btn">Sign in</a>
            </div>
        </nav>
        <section class="hero-content">
            <div class="hero-left">
                <img src="assets/food-left.png" alt="Food illustration">
            </div>

            <div class="hero-center">
                <h1>
                    Order food & groceries.
                    Discover best restaurants.
                    Swiggy it!
                </h1>
                <div class="search-row">

                    <div class="location-box">
                        <i class="fa-solid fa-location-dot"></i>
                        <select name="location" id="location">
                            <option value="" selected disabled>
                                Enter your delivery location
                            </option>
                        </select>
                    </div>

                    <div class="search-box">
                        <input type="text" placeholder="Search for restaurant, item or more">
                        <span><i class="fa-solid fa-magnifying-glass"></i></span>
                    </div>
                </div>
            </div>

            <div class="hero-right">
                <img src="assets/food-right.png" alt="Food illustration">
            </div>

        </section>
    </header>

    <section class="services-section">
        <div class="service-card">

            <h2>FOOD DELIVERY</h2>

            <p>FROM RESTAURANTS</p>

            <span>UPTO 60% OFF</span>

            <img src="assets/food-delivery.png" alt="Food Delivery">

            <div class="arrow">→</div>

        </div>

        <div class="service-card">

            <h2>INSTAMART</h2>

            <p>INSTANT GROCERY</p>

            <span>UPTO 60% OFF</span>

            <img src="assets/instamart.png" alt="Food Delivery">

            <div class="arrow">→</div>

        </div>

        <div class="service-card">

            <h2>DINEOUT</h2>

            <p>EAT OUT &amp; SAVE MORE</p>

            <span>UPTO 60% OFF</span>

            <img src="assets/dineout.png" alt="Food Delivery">

            <div class="arrow">→</div>

        </div>
    </section>

</body>
</html>
